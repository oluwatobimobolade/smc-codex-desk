schema: smc_codex_repository_register_v1
effective_date: "2026-07-10"

repositories:
  canonical:
    path: /Users/tobimobolade/smc-codex-desk
    role: canonical_source_and_governance_repository
    authority: current
    validation_registry: evidence/VALIDATION_REGISTRY.json
  companion_archive:
    path: /Users/tobimobolade/smc-live-market-truth-integration
    role: historical_companion_and_reference_only
    authority: non_authoritative
    import_into_canonical_runtime: prohibited
    validation_registry_authority: ignored
