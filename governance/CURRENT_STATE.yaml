known_constraints:
  - No live capital execution.
  - Do not tune on final holdout.
  - Do not combine the 50-case pilot and 100-case local lab.
  - Do not promote AI labels to human gold.
  - Do not treat old strategies/smc documents as active authority.
  - Do not let legacy_comparison outputs drive current colleague decisions.
  - Do not treat resolved no-trade observations as trade performance.
  - Do not treat reviewer drafts as gold labels before adjudication.
  - Do not claim strategy edge, paper execution, or live execution from runtime config migration.
  - Do not issue live signals from TradingView screenshots when verified closed OHLCV is unavailable.
  - Treat older 389/405/426/453 test-count records as historical provenance unless superseded by the latest validation registry.
  - Do not freeze a clean release package from a dirty working tree without recording the exact status and hashes.
  - Do not treat WP-0020 TradingView screenshots as market truth; visual audit is available, but canonical OHLCV remains the Binance CSV source and TradingView candle timing was not DOM-verified.
