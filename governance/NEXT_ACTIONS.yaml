  - id: WP-SMC-28-RISK-MODULE
    priority: 0
    title: Price a trade -- stop, target, R, expectancy
    owner: Trading Systems Engineer
    status: NOT_STARTED
    blocks: every downstream result, because a system that cannot price a trade
      terminates good and bad findings in the same REVIEW_REQUIRED
    evidence: >-
      Live BTCUSDT priced at R=0.07 against the narrative invalidation (the 1d
      protected high, 30% away) and R=3.94 against the setup invalidation (the
      POI edge plus 1x 4h ATR). Same setup, two stops. Round-trip cost is 2.8%
      of the reward at the second.
    scope:
      - separate narrative invalidation from setup invalidation
      - derive R from the POI edge and the already-computed liquidity draw
      - expectancy from R and the ledger-measured hold rate
      - reject setups whose reward is small relative to spread and slippage
    prohibited:
      - creating signal, paper or live authority
      - sizing recommendations without a measured win rate

