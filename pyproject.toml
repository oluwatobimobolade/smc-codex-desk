[project]
name = "smc-codex-desk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "mplfinance>=0.12",
  "pillow>=10.0",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "plotly>=5.20",
  "opencv-python>=4.10",
  "requests>=2.31",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["smc_desk*"]
